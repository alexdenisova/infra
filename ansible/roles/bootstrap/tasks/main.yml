---
- name: Configuration
  tags: [bootstrap]
  become: true
  block:
    - name: Mount disk
      ansible.builtin.import_tasks: mount_disk.yml
      when: bootstrap__mount_disk
    - name: Install packages
      ansible.builtin.apt:
        name: "{{ bootstrap__default_packages + bootstrap__apt_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Configure firewall
      ansible.builtin.import_tasks: firewall.yml
