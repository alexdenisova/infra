{{- $defaults := .Values.postgresBackuper -}}
{{- range $name, $backup := .Values.backups }}
{{- $fullname := include "postgres-backuper.fullname" (list $ $name) }}
{{- $selectorLabels := dict "app.kubernetes.io/name" $.Chart.Name "app.kubernetes.io/instance" $name }}
{{- $nameEnv := dict "PB__BACKUP_PATH" (printf "%s/backup.sql" $name) "PB__GIT_COMMIT_MSG" (printf "Postgres Backup: %s" $name) }}
{{- $env := merge (deepCopy ($backup.env | default dict)) $nameEnv (deepCopy $defaults.env) }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "postgres-backuper.labels" $ | nindent 4 }}
    app.kubernetes.io/instance: {{ $name }}
spec:
  concurrencyPolicy: Forbid
  schedule: {{ $backup.schedule | default $defaults.schedule | quote }}
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          name: {{ $fullname }}
          labels:
            {{- toYaml $selectorLabels | nindent 12 }}
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: {{ $.Values.registry_secret.name }}
          containers:
            - name: postgres-backuper
              image: "{{ $defaults.image.repository }}:{{ $defaults.image.tag }}"
              imagePullPolicy: {{ $defaults.image.pullPolicy }}
              env:
                {{- range $k, $v := $env }}
                - name: {{ $k }}
                  value: {{ $v | quote }}
                {{- end }}
              envFrom:
                - secretRef:
                    name: {{ $fullname }}
                    optional: false
              resources:
                {{- toYaml $defaults.resources | nindent 16 }}
{{- end }}
