{{- $defaults := .Values.postgresBackuper -}}
{{- range $name, $backup := .Values.backups }}
{{- $secretValues := merge (deepCopy ($backup.secretValues | default dict)) (deepCopy $defaults.secretValues) }}
{{- $_ := required (printf "backups.%s.secretValues.PB__DB_URL is required" $name) $secretValues.PB__DB_URL }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres-backuper.fullname" (list $ $name) }}
  labels:
    {{- include "postgres-backuper.labels" $ | nindent 4 }}
    app.kubernetes.io/instance: {{ $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
data:
  {{- range $k, $v := $secretValues }}
  {{ $k }}: {{ $v | b64enc }}
  {{- end }}
{{- end }}
