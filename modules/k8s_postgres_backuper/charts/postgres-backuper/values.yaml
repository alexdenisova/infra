---
registry_secret:
  name: registrypullsecret
  data: ""

# Defaults shared by every backup
postgresBackuper:
  name: postgres-backuper
  schedule: "0 0 * * *"
  annotations: {}
  resources:
    limits:
      memory: 256Mi
      cpu: 200m
    requests:
      memory: 128Mi
      cpu: 100m
  image:
    repository: ghcr.io/alexdenisova/postgres-backuper
    pullPolicy: IfNotPresent
    tag: 16-alpine
  env:
    PB__GIT_EMAIL: ""
    PB__GIT_NAME: "Postgres Backuper"
  secretValues:
    PB__GITHUB_REPO_URL: ""

# One CronJob per entry, named <postgresBackuper.name>-<key>.
# PB__BACKUP_PATH defaults to <key>/backup.sql, PB__GIT_COMMIT_MSG to "Postgres Backup: <key>".
# Each entry may override schedule, env and secretValues; secretValues.PB__DB_URL is required.
backups: {}
#  pantry-tracker:
#    schedule: "0 0 * * *"
#    env:
#      PB__BACKUP_PATH: pantry-tracker/backup.sql
#    secretValues:
#      PB__DB_URL: postgresql://user:pass@host:5432/db
