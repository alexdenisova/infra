[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "vm"
version = "0.1.0"
description = ""
authors = []

[tool.poetry.dependencies]
python = "^3.10"
ansible = "^10.7.0"
pydantic = "^2.9.0"

[tool.poetry.group.dev.dependencies]
isort = "^5.13.2"
black = "^24.10.0"
ansible-lint = { version = "^24.10.0", markers = "platform_system != 'Windows'" }

[tool.pyright]
exclude = [
    ".cache/**",
    ".vscode/**",
    ".venv/**",
    "**/site-packages/**",
]
